name: hft-scan

on:
  push:
    branches: [main-t2qdvg]
    paths: ["scalper/research/hft/scan.py", "scalper/research/hft/adhoc.sh", ".github/workflows/hft-scan.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: scalper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow numpy orjson numba
      - name: Ad-hoc HFT job
        run: mkdir -p ../out && set -o pipefail && bash research/hft/adhoc.sh 2>&1 | tee ../out/log.txt
      - name: Publish results to research-results branch
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898277+github-actions[bot]@users.noreply.github.com"
          dest="runs/${GITHUB_RUN_ID}"
          git fetch origin research-results || true
          if git rev-parse --verify -q origin/research-results; then
            git worktree add rr origin/research-results
            git -C rr checkout -B research-results
          else
            git worktree add --detach rr
            git -C rr checkout --orphan research-results
            git -C rr rm -rfq .
          fi
          mkdir -p "rr/$dest"
          cp -r out/. "rr/$dest/" 2>/dev/null || true
          echo "${GITHUB_SHA}" > "rr/$dest/commit.txt"
          git -C rr add runs
          git -C rr commit -qm "research results run ${GITHUB_RUN_ID} (${GITHUB_SHA::7})"
          git -C rr push origin research-results
