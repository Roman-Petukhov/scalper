name: research

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "search | oos | all"
        default: "all"
      start:
        default: "2022-01"
      end:
        default: "2026-09"
  push:
    branches: [main-t2qdvg]
    paths: ["scalper/research/**", ".github/workflows/research.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: scalper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scalper/requirements.txt
      - run: pip install -r requirements.txt
      - name: Cache market data
        uses: actions/cache@v4
        with:
          path: ~/rs/cache
          key: binance-um-5m-${{ inputs.start || '2022-01' }}-${{ inputs.end || '2026-09' }}-v1
          restore-keys: binance-um-5m-
      - name: Download data
        run: python -m research.data --root ~/rs --start ${{ inputs.start || '2022-01' }} --end ${{ inputs.end || '2026-09' }}
      - name: Search (IS) -> finalists -> OOS
        run: mkdir -p ../out && set -o pipefail && python -m research.search --root ~/rs --out ../out --stage ${{ inputs.stage || 'all' }} | tee ../out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-results
          path: out
      - name: Publish results to research-results branch
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898277+github-actions[bot]@users.noreply.github.com"
          dest="runs/${GITHUB_RUN_ID}"
          git fetch origin research-results || true
          if git rev-parse --verify -q origin/research-results; then
            git worktree add rr origin/research-results
            git -C rr checkout -B research-results
          else
            git worktree add --detach rr
            git -C rr checkout --orphan research-results
            git -C rr rm -rfq .
          fi
          mkdir -p "rr/$dest"
          cp out/*.csv out/log.txt "rr/$dest/" 2>/dev/null || true
          echo "${GITHUB_SHA}" > "rr/$dest/commit.txt"
          git -C rr add runs
          git -C rr commit -qm "research results run ${GITHUB_RUN_ID} (${GITHUB_SHA::7})"
          git -C rr push origin research-results
