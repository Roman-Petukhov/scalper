name: probe

on:
  push:
    branches: [main-t2qdvg]
    paths: [".github/probe_urls.txt"]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        # first 1500 bytes of each response go to the job log
        run: |
          while read -r u; do
            [ -z "$u" ] && continue
            echo "===== $u"
            curl -sS -m 30 -A "Mozilla/5.0" -H "Accept: application/json" "$u" | head -c 1500 || echo "FAILED"
            echo
          done < .github/probe_urls.txt
