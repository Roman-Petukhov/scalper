# VPS без домена: панель слушает только 127.0.0.1:8000, снаружи её не видно; доступ с ваших устройств — через
# Tailscale (tailscale serve --bg localhost:8000 → https://<сервер>.<tailnet>.ts.net, HTTPS и push работают).
#   cd deploy && cp env.example .env && nano .env && docker compose -f docker-compose.tailscale.yml up -d --build
services:
  trader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    volumes:
      - trader-data:/data
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  trader-data:
