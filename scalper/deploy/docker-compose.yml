# Запуск на VPS: cd deploy && cp env.example .env && (заполнить .env) && docker compose up -d --build
services:
  trader:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    volumes:
      - trader-data:/data
    restart: unless-stopped
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - trader
volumes:
  trader-data:
  caddy-data:
  caddy-config:
